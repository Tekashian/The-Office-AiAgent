name: CD Pipeline

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: Determine Deployment Environment
  # ==========================================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set version
        id: set-version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # JOB 2: Build & Push Docker Images
  # ==========================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 30

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/office-agent-${{ matrix.service }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ==========================================
  # JOB 3: Deploy to Staging
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup, build-images]
    if: needs.setup.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.office-agent.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name office-agent-staging --region ${{ secrets.AWS_REGION }}

      - name: Deploy backend to Kubernetes
        run: |
          kubectl set image deployment/backend-deployment \
            backend=ghcr.io/${{ github.repository }}/backend:${{ needs.setup.outputs.version }} \
            -n staging
          kubectl rollout status deployment/backend-deployment -n staging --timeout=5m

      - name: Deploy frontend to Kubernetes
        run: |
          kubectl set image deployment/frontend-deployment \
            frontend=ghcr.io/${{ github.repository }}/frontend:${{ needs.setup.outputs.version }} \
            -n staging
          kubectl rollout status deployment/frontend-deployment -n staging --timeout=5m

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging-api.office-agent.example.com/health || exit 1
          curl -f https://staging.office-agent.example.com || exit 1

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 Staging deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Complete*\n\nVersion: `${{ needs.setup.outputs.version }}`\nCommit: <${{ github.event.head_commit.url }}|${{ github.event.head_commit.message }}>\nEnvironment: https://staging.office-agent.example.com"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ==========================================
  # JOB 4: Deploy to Production
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup, build-images]
    if: needs.setup.outputs.environment == 'production'
    environment:
      name: production
      url: https://office-agent.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name office-agent-production --region ${{ secrets.AWS_REGION }}

      - name: Create database backup
        run: |
          echo "Creating database backup before deployment..."
          # Trigger Supabase backup or use pg_dump
          curl -X POST https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_ID }}/database/backups \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"

      - name: Deploy backend to Kubernetes (Blue-Green)
        run: |
          # Deploy new version (green)
          kubectl set image deployment/backend-deployment-green \
            backend=ghcr.io/${{ github.repository }}/backend:${{ needs.setup.outputs.version }} \
            -n production
          kubectl rollout status deployment/backend-deployment-green -n production --timeout=10m

          # Switch traffic to green
          kubectl patch service backend-service -n production \
            -p '{"spec":{"selector":{"version":"green"}}}'

          # Wait and verify
          sleep 60
          curl -f https://api.office-agent.example.com/health || exit 1

          # Scale down blue deployment
          kubectl scale deployment/backend-deployment-blue --replicas=0 -n production

      - name: Deploy frontend to Kubernetes (Blue-Green)
        run: |
          # Deploy new version (green)
          kubectl set image deployment/frontend-deployment-green \
            frontend=ghcr.io/${{ github.repository }}/frontend:${{ needs.setup.outputs.version }} \
            -n production
          kubectl rollout status deployment/frontend-deployment-green -n production --timeout=10m

          # Switch traffic to green
          kubectl patch service frontend-service -n production \
            -p '{"spec":{"selector":{"version":"green"}}}'

          # Wait and verify
          sleep 60
          curl -f https://office-agent.example.com || exit 1

          # Scale down blue deployment
          kubectl scale deployment/frontend-deployment-blue --replicas=0 -n production

      - name: Run production smoke tests
        run: |
          npm ci
          npm run test:smoke -- --env production
        env:
          API_URL: https://api.office-agent.example.com
          APP_URL: https://office-agent.example.com

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ needs.setup.outputs.version }}
          body: |
            ## Changes in this Release
            ${{ github.event.head_commit.message }}

            ## Deployment Details
            - Environment: Production
            - Deployed at: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🎉 Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Complete*\n\nVersion: `${{ needs.setup.outputs.version }}`\nCommit: <${{ github.event.head_commit.url }}|${{ github.event.head_commit.message }}>\nEnvironment: https://office-agent.example.com"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ==========================================
  # JOB 5: Rollback Mechanism
  # ==========================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy-staging, deploy-production]
    if: failure()
    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback to previous version
        run: |
          kubectl rollout undo deployment/backend-deployment -n ${{ needs.setup.outputs.environment }}
          kubectl rollout undo deployment/frontend-deployment -n ${{ needs.setup.outputs.environment }}

      - name: Notify Slack about rollback
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ Deployment failed - Rollback initiated",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Rollback Triggered*\n\nEnvironment: ${{ needs.setup.outputs.environment }}\nReason: Deployment failure\nAction: Reverted to previous stable version"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
