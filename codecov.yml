coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 8%  # Current baseline - incrementally increase
        threshold: 2%
        informational: true  # Don't block PRs yet
    patch:
      default:
        target: 40%  # New code should have decent coverage
        threshold: 10%
        informational: true

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false

ignore:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**"
  - "**/__tests__/**"
